[package]
name = "catpay"
edition = "2021"
version = "0.1.0"
publish = false

[dependencies]
async-trait = "0.1.89"
base58ck = "0.1"
bech32 = "0.11"
bip32 = "0.5.3"
bs58 = "0.5"
cashaddr = "0.2"
corepc-client = { version = "0.16.0", default-features = false, features = ["client-sync"] }
data-encoding = "2.9.0"
futures = "0.3.32"
hex = "0.4.3"
metrics = "0.24.2"
reqwest = { version = "0.12.18", default-features = false, features = ["json", "rustls-tls"] }
ripemd = "0.1.3"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
sha3 = "0.12.0"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["sync", "rt", "macros", "time", "net", "io-util"] }
tokio-rustls = "0.26"
webpki-roots = "1"

[lints.clippy]
allow_attributes = "warn"

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
